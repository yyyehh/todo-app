<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的待辦清單</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h1>我的待辦清單</h1>
        <div class="add-box">
            <input type="text" placeholder="請輸入待辦事項...">
            <button>新增</button>
        </div>
        <ul id="todo-list"></ul>

        <script>    
            function renderTodo(todo) {
                const li = document.createElement('li');
                li.textContent = todo.title;
                if (todo.done) li.style.textDecoration = 'line-through';

                li.addEventListener('click', () => {
                    fetch(`/api/todos/${todo.id}`, { method: 'PUT' })
                    .then(res => res.json())
                    .then(updated => {
                        li.style.textDecoration = updated.done ? 'line-through' : 'none';
                    });
                });

                const delBtn = document.createElement('button');
                delBtn.textContent = '刪除';
                delBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    fetch(`/api/todos/${todo.id}`, { method: 'DELETE' })
                    .then(() => li.remove());
                });

                li.appendChild(delBtn);
                document.getElementById('todo-list').appendChild(li);
            }

            // 抓取全部清單，改用 renderTodo 顯示
            fetch('/api/todos')
            .then(res => res.json())
            .then(todos => {
                todos.forEach(renderTodo);
            });

            document.querySelector('.add-box button').addEventListener('click', () => {
            const input = document.querySelector('.add-box input');
            const title = input.value.trim();
            if (!title) return;

            fetch('/api/todos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title })
            })
                .then(res => res.json())
                .then(newTodo => {
                renderTodo(newTodo);
                input.value = '';
                });
            });
        </script>
    </div>
</body>
</html>
