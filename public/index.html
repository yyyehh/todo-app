<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的待辦清單</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <h1>我的待辦清單</h1>

    <div class="add-box">
      <input type="text" id="title-input" placeholder="請輸入待辦事項...">
      <input type="date" id="due-date-input">
      <select id="category-select">
        <option value="未分類">未分類</option>
        <option value="作業">作業</option>
        <option value="生活">生活</option>
        <option value="鐵人賽">鐵人賽</option>
      </select>
      <button id="add-btn">新增</button>
    </div>

    <div class="filter-box">
      <label>篩選分類：</label>
      <select id="filter-select">
        <option value="">全部</option>
        <option value="未分類">未分類</option>
        <option value="作業">作業</option>
        <option value="生活">生活</option>
        <option value="鐵人賽">鐵人賽</option>
      </select>
    </div>

    <ul id="todo-list"></ul>
  </div>

  <script>
    const listEl = document.getElementById('todo-list');
    const filterEl = document.getElementById('filter-select');

    function renderTodo(todo) {
      const li = document.createElement('li');

      const tag = document.createElement('span');
      tag.textContent = `[${todo.category}] `;
      tag.style.color = '#888';
      tag.style.fontSize = '0.85em';

      const text = document.createElement('span');
      text.textContent = todo.title;

      const date = document.createElement('span');
      date.textContent = todo.due_date ? ` (截止：${todo.due_date})` : '';
      date.style.color = '#c00';
      date.style.fontSize = '0.8em';

      li.appendChild(tag);
      li.appendChild(text);
      li.appendChild(date);

      if (todo.done) li.style.textDecoration = 'line-through';

      li.addEventListener('click', () => {
        fetch(`/api/todos/${todo.id}`, { method: 'PUT' })
          .then(res => res.json())
          .then(updated => {
            li.style.textDecoration = updated.done ? 'line-through' : 'none';
          });
      });

      const delBtn = document.createElement('button');
      delBtn.textContent = '刪除';
      delBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        fetch(`/api/todos/${todo.id}`, { method: 'DELETE' })
          .then(() => li.remove());
      });

      li.appendChild(delBtn);
      listEl.appendChild(li);
    }

    // 重新向後端要一份（排序好、篩選好的）清單
    function loadTodos() {
      const category = filterEl.value;
      const url = category
        ? `/api/todos?category=${encodeURIComponent(category)}`
        : '/api/todos';

      fetch(url)
        .then(res => res.json())
        .then(todos => {
          listEl.innerHTML = '';
          todos.forEach(renderTodo);
        });
    }

    filterEl.addEventListener('change', loadTodos);

    document.getElementById('add-btn').addEventListener('click', () => {
      const titleInput = document.getElementById('title-input');
      const dueDateInput = document.getElementById('due-date-input');
      const category = document.getElementById('category-select').value;
      const title = titleInput.value.trim();
      const due_date = dueDateInput.value || null;

      if (!title) {
        alert('請輸入待辦事項內容');
        return;
      }

      fetch('/api/todos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, category, due_date })
      })
        .then(res => {
          if (!res.ok) return res.json().then(err => { throw new Error(err.message); });
          return res.json();
        })
        .then(() => {
          titleInput.value = '';
          dueDateInput.value = '';
          loadTodos(); // 新增後重新載入，順序就會是後端排好的
        })
        .catch(err => alert(err.message));
    });

    loadTodos();
  </script>
</body>
</html>
