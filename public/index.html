<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的待辦清單</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h1>我的待辦清單</h1>
        <div class="add-box">
            <input type="text" placeholder="請輸入待辦事項...">
            <button>新增</button>
        </div>
        <ul id="todo-list"></ul>

        <script>    
            fetch('/api/todos')
            .then(res => res.json())
            .then(todos => {
                const list = document.getElementById('todo-list');
                todos.forEach(todo => {
                    const li = document.createElement('li');
                    li.textContent = todo.title;
                    list.appendChild(li);
                });
            })
        </script>
    </div>
</body>
</html>
