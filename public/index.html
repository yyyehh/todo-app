<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的待辦清單</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h1>我的待辦清單</h1>
        <div class="add-box">
        <input type="text" placeholder="請輸入待辦事項...">
        <input type="date" id="due-date-input">
        <select id="category-select">
            <option value="未分類">未分類</option>
            <option value="作業">作業</option>
            <option value="生活">生活</option>
            <option value="鐵人賽">鐵人賽</option>
        </select>
        <button>新增</button>
        </div>
        <ul id="todo-list"></ul>

        <script>    
            function renderTodo(todo) {
            const li = document.createElement('li');

            const tag = document.createElement('span');
            tag.textContent = `[${todo.category}] `;
            tag.style.color = '#888';
            tag.style.fontSize = '0.85em';

            const text = document.createElement('span');
            text.textContent = todo.title;

            const date = document.createElement('span');
            date.textContent = todo.due_date ? ` (截止：${todo.due_date})` : '';
            date.style.color = '#c00';
            date.style.fontSize = '0.8em';

            li.appendChild(tag);
            li.appendChild(text);
            li.appendChild(date);

            if (todo.done) li.style.textDecoration = 'line-through';

            li.addEventListener('click', () => {
                fetch(`/api/todos/${todo.id}`, { method: 'PUT' })
                .then(res => res.json())
                .then(updated => {
                    li.style.textDecoration = updated.done ? 'line-through' : 'none';
                });
            });

            const delBtn = document.createElement('button');
            delBtn.textContent = '刪除';
            delBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                fetch(`/api/todos/${todo.id}`, { method: 'DELETE' })
                .then(() => li.remove());
            });

            li.appendChild(delBtn);
            document.getElementById('todo-list').appendChild(li);
            }

            // 抓取全部清單，改用 renderTodo 顯示
            fetch('/api/todos')
            .then(res => res.json())
            .then(todos => {
                todos.forEach(renderTodo);
            });

            document.querySelector('.add-box button').addEventListener('click', () => {
            const input = document.querySelector('.add-box input[type="text"]');
            const dueDateInput = document.getElementById('due-date-input');
            const category = document.getElementById('category-select').value;
            const title = input.value.trim();
            const due_date = dueDateInput.value || null;

            if (!title) {
                alert('請輸入待辦事項內容');
                return;
            }

            fetch('/api/todos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, category, due_date })
            })
                .then(res => {
                if (!res.ok) return res.json().then(err => { throw new Error(err.message); });
                return res.json();
                })
                .then(newTodo => {
                renderTodo(newTodo);
                input.value = '';
                dueDateInput.value = '';
                })
                .catch(err => alert(err.message));
            });
        </script>
    </div>
</body>
</html>
